services:

  # ── PHP-FPM / Laravel ────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: proviemplea_app
    volumes:
      - .:/var/www
    networks:
      - proviemplea_network
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ── Nginx (servidor web) ─────────────────────────────────────────────────
  web:
    image: nginx:1.27-alpine
    container_name: proviemplea_web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - proviemplea_network
    depends_on:
      - app
    restart: unless-stopped

  # ── MySQL 8.0 ────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: proviemplea_db
    environment:
      MYSQL_DATABASE: proviemplea
      MYSQL_USER: proviemplea_user
      MYSQL_PASSWORD: proviemplea_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - proviemplea_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uproviemplea_user", "-pproviemplea_pass"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  proviemplea_network:
    driver: bridge

volumes:
  dbdata:
    driver: local
